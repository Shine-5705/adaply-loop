<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace · Adaply Loop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c7cf8'/><rect x='9' y='9' width='14' height='14' rx='4' fill='%230a0a0b'/></svg>">
<script src="../assets/theme.js"></script>
<link rel="stylesheet" href="../assets/base.css">
<style>
body{height:100vh;overflow:hidden}html,body{max-width:100vw;overflow-x:hidden}
.shell{display:grid;grid-template-columns:232px 1fr;height:100vh}
aside{border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px}
aside .logo{padding:4px 8px 16px}
.ws{margin:0 0 16px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.ws b{display:block;color:var(--ink);font-size:13px;font-weight:500}.ws span{font-size:12px;color:var(--muted)}
.navlbl{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:var(--body);font-size:14px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit;transition:background .12s,color .12s}
.nav:hover{background:var(--panel2);color:var(--ink)}.nav.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav .n{margin-left:auto;font:12px var(--mono);color:var(--muted)}
aside .foot{margin-top:auto;padding:8px;font-size:12px;color:var(--muted);line-height:1.5}aside .foot a{color:var(--body)}aside .foot a:hover{color:var(--ink)}
main{display:flex;min-height:0;flex-direction:column;min-width:0;overflow:hidden}
header{height:56px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 24px}
header h1{font-size:15px;font-weight:500;color:var(--ink);margin:0}header .crumb{color:var(--muted);font-size:15px}header .sp{flex:1}
.menu{display:none}
.content{flex:1;overflow:auto;padding:24px}
.view{display:none;max-width:1120px;margin:0 auto;animation:fade .2s ease}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 16px}
.vh h2{margin:0;font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.015em}.vh p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{border:1px solid var(--line);background:var(--panel);border-radius:var(--r2);padding:16px}
.kpi span{font-size:13px;color:var(--muted)}.kpi b{display:block;font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{font:12px var(--mono);color:var(--muted)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--r2);overflow:hidden}
.card+.card{margin-top:16px}.grid2>.card{margin-top:0}
.ch{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-bottom:1px solid var(--line)}.ch h3{margin:0;font-size:14px;font-weight:500;color:var(--ink)}.ch .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--panel2)}
td.num{font:13px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}td.mono{font:13px var(--mono);color:var(--muted)}
.rule{color:var(--ink);font-weight:500}
.ev td{background:var(--bg2);padding:4px 16px 16px}
.quote{border-left:2px solid var(--acc);padding:8px 12px;margin:12px 0 0;background:var(--panel);border-radius:0 6px 6px 0;font-size:13.5px;color:var(--body)}
.quote small{display:block;font:12px var(--mono);color:var(--muted);margin-top:4px}
.checks{display:flex;gap:12px;flex-wrap:wrap;font:12px var(--mono);margin-top:12px}.checks .p{color:var(--ok)}.checks .f{color:var(--bad)}
.chev{transition:transform .15s;color:var(--muted)}tr.open .chev{transform:rotate(90deg)}
.diff{display:grid;grid-template-columns:1fr 1fr;font:12.5px/1.75 var(--mono)}.diff>div{min-width:0}.diff>div:nth-child(even){border-left:1px solid var(--line)}.diff .ln:nth-child(3),.diff .ln:nth-child(4){padding-top:8px}.tw{overflow-x:auto}
.dh{font:500 12px var(--mono);color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2);display:flex;gap:8px}
.code{font:12.5px/1.75 var(--mono);padding:8px 0;overflow-x:auto}
.ln{display:grid;grid-template-columns:40px 16px 1fr;padding-right:16px;white-space:pre-wrap;word-break:break-word}
.ln i{font-style:normal;color:var(--muted);opacity:.6;text-align:right;padding-right:8px;user-select:none}.ln u{text-decoration:none;color:var(--muted)}
.ln.add{background:var(--add)}.ln.add u{color:var(--ok)}.ln.del{background:var(--del)}.ln.del u{color:var(--bad)}.ln.pad{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 45%,transparent) 6px 7px)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.tl li:last-child{border:0}
.tl .v{font:600 13px var(--mono);color:var(--ink);width:44px}.tl .meta{flex:1;min-width:0}.tl .meta b{display:block;color:var(--ink);font-weight:500;font-size:14px}.tl .meta span{font-size:13px;color:var(--muted)}
.empty{padding:64px 24px;text-align:center}.empty .ic{width:44px;height:44px;margin:0 auto 16px;border-radius:12px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted);background:var(--panel2)}
.empty h3{margin:0 0 8px;color:var(--ink);font-size:16px;font-weight:600}.empty p{margin:0 auto 24px;max-width:420px;font-size:14px;color:var(--muted)}.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.drop{border:1px dashed var(--line2);border-radius:var(--r2);transition:border-color .15s,background .15s}.drop.on{border-color:var(--acc);background:var(--accbg)}
.sk{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--panel2) 0%,var(--line) 50%,var(--panel2) 100%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;font-weight:500;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50}.toast.on{opacity:1;transform:none}
.note{font-size:13px;color:var(--muted);margin:16px 0 0}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.mini{padding:12px 16px;border-bottom:1px solid var(--line)}.mini:last-child{border:0}.mini .top{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink)}.mini .top span{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.hide-sm{}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}aside.open{transform:none}
  .menu{display:inline-flex}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.diff{font-size:11px}.diff .ln{grid-template-columns:24px 12px 1fr;padding-right:6px}.lbl-sm{display:none}
  .hide-sm{display:none}.content{padding:16px}.vh{flex-wrap:wrap;align-items:flex-start}header{padding:0 12px}th,td{padding:10px 12px}header .crumb{display:none}
}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
<symbol id="i-diff" viewBox="0 0 24 24"><path d="M6 3v12M18 9v12M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 18h4a5 5 0 0 0 5-5"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
</defs></svg>
<div class="shell">
<aside id="side">
  <a class="logo" href="../"><span class="mark"></span>Adaply Loop</a>
  <div class="ws"><b id="wsname">No workspace loaded</b><span id="wsmeta">Load logs to begin</span></div>
  <div class="navlbl">Workspace</div>
  <button class="nav on" data-v="overview"><svg class="icon"><use href="#i-home"/></svg>Overview</button>
  <button class="nav" data-v="sessions"><svg class="icon"><use href="#i-file"/></svg>Sessions<span class="n" id="n-s">0</span></button>
  <button class="nav" data-v="corrections"><svg class="icon"><use href="#i-layers"/></svg>Corrections<span class="n" id="n-c">0</span></button>
  <button class="nav" data-v="rules"><svg class="icon"><use href="#i-diff"/></svg>Rules diff<span class="n" id="n-r">0</span></button>
  <button class="nav" data-v="history"><svg class="icon"><use href="#i-clock"/></svg>Version history<span class="n" id="n-h">0</span></button>
  <div class="foot">Everything runs in this tab. Logs never leave your browser.<br><a href="https://github.com/Shine-5705/adaply-loop">GitHub</a> · <a href="../#docs">Docs</a></div>
</aside>
<main>
<header>
  <button class="btn ghost sm menu theme-btn" aria-label="Menu" onclick="side.classList.toggle('open')"><svg class="icon"><use href="#i-menu"/></svg></button>
  <span class="crumb">acme-invoices&nbsp;/</span><h1 id="title">Overview</h1><span id="samplebadge" class="badge sample" hidden>Sample data</span>
  <span class="sp"></span>
  <label class="btn sm hide-sm" for="file"><svg class="icon"><use href="#i-up"/></svg>Open logs</label>
  <button class="btn sm primary" id="loadSample"><svg class="icon"><use href="#i-play"/></svg><span class="lbl-sm">Load sample</span></button>
  <button class="btn ghost sm theme-btn" aria-label="Toggle theme" onclick="toggleTheme()"><svg class="icon"><use href="#i-sun"/></svg></button>
  <input id="file" type="file" accept=".jsonl" multiple hidden>
</header>
<div class="content" id="content">
  <section class="view on" id="v-overview"></section>
  <section class="view" id="v-sessions"></section>
  <section class="view" id="v-corrections"></section>
  <section class="view" id="v-rules"></section>
  <section class="view" id="v-history"></section>
</div>
</main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="./app.js"></script>
</body></html>
